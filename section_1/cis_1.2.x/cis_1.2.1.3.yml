---

{{ if .Vars.suse16cis_level_2 }}
  {{ if .Vars.run_heavy_tests }}
    {{ if .Vars.suse16cis_rule_1_2_1_3 }}
command:
  repo_gpgcheck_global:
    title: 1.2.1.3 | Ensure repo_gpgcheck is configured
    exec: grep -E "^repo_gpgcheck" /etc/zypp/zypp.conf /etc/zypp/zypp.conf.d/*
    timeout: {{ .Vars.timeout_ms }}
    exit-status:
      or:
      - 0
      - 1
      - 2
    stdout:
    - '/^.*:repo_gpgcheck\s*=\s*(1|on)/'
    - '!/^.*:repo_gpgcheck\s*=\s*(0|false|off|no)/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 1.2.1.3
      NIST800-53R5: SI-2
  repo_gpgcheck_repo:
    title: 1.2.1.3 | Ensure repo_gpgcheck is configured
    exit-status: 0
    exec: if [ `find /etc/zypp/repos.d/ -type f -exec grep 'repo_gpgcheck*' {} \; | grep -v '1|on|true' | wc -l` -ne 0 ]; then echo FAIL; else echo OK; fi
    stdout:
    - 'OK'
    timeout: {{ .Vars.timeout_ms }}
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 1.2.1.3
      NIST800-53R5: SI-2
    {{ end }}
  {{ end }}
{{ end }}
