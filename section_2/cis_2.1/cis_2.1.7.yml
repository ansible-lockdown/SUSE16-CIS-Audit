---

{{ if .Vars.suse16cis_level_1 }}
  {{ if .Vars.suse16cis_rule_2_1_7 }}
    {{ if not .Vars.suse16cis_ldap_server }}
      {{ if not .Vars.suse16cis_ldap_mask }}
package:
  {{- range mkSlice "openldap2" "openldap2_5" }}
  {{ . }}:
    title: 2.1.7 | Ensure ldap server services are not in use | {{ . }} pkg removed
    name: {{ . }}
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.7
      NIST800-53R5:
      - CM-7
  {{ end }}
  {{ end }}
  {{ if .Vars.suse16cis_ldap_mask }}
file:
  ldap_service_masked:
    title: 2.1.7 | Ensure ldap server services are not in use | masked
    path: /etc/systemd/system/slapd.service
    exists: true
    filetype: symlink
    linked-to: /dev/null
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.7
      NIST800-53R5:
      - CM-7
      {{ end }}
    {{ end }}
  {{ end }}
{{ end }}
