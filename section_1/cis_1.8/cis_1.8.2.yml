---

{{ if .Vars.suse16cis_gui }}
  {{ if .Vars.suse16cis_level_1 }}
    {{ if .Vars.suse16cis_rule_1_8_2 }}
file:
  gdm_disable_user_list:
    title: 1.8.2 | Ensure GDM disable-user-list is configured | keyfile
    path: /etc/dconf/db/{{ .Vars.suse16cis_dconf_db_name }}.d/00-login-screen
    exists: true
    contents:
    - '/^\[org\/gnome\/login-screen\]/'
    - '/^disable-user-list=true/'
    - '!/^disable-user-list=false/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.8.2
      NIST800-53R5: NA
  gdm_disable_user_list_lock:
    title: 1.8.2 | Ensure GDM disable-user-list is configured | lock
    path: /etc/dconf/db/{{ .Vars.suse16cis_dconf_db_name }}.d/locks/00-login-screen_lock
    exists: true
    contents:
    - '/^\/org\/gnome\/login-screen\/disable-user-list/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.8.2
      NIST800-53R5: NA
    {{ end }}
  {{ end }}
{{ end }}
