---

{{ if .Vars.suse16cis_level_1 }}
  {{ if .Vars.suse16cis_rule_1_4_1 }}
    {{ if .Vars.suse16cis_set_boot_pass }}
  file:
    grub_bootloader_passwd:
      title: 1.4.1 | Ensure bootloader password is set
      path: /boot/grub2/grub.cfg
      exists: true
      owner: root
      group: root
      mode: "0600"
      contents:
      - '/^\s*set superusers={{ .Vars.suse16cis_grub_user }}/'
      - '/^\s*password_pbkdf2.*\s{{ .Vars.suse16cis_bootloader_password_hash }}\'
      meta:
        server: 1
        workstation: 1
        CIS_ID:
        - 1.4.1
        NIST800-53R5: AC-3
    {{ end }}
  {{ end }}
{{ end }}
