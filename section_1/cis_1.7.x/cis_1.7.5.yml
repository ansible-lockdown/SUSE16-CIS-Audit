---

{{ if .Vars.suse16cis_level_1 }}
  {{ if .Vars.suse16cis_rule_1_7_5 }}
command:
  sshd_banner_content:
    title: 1.7.5 | Ensure sshd warning Banner is configured
    exec: |
      b="$(sshd -T 2>/dev/null | awk '$1 == "banner" {print $2}')"
      [ -n "$b" ] && [ "$b" != none ] && [ -r "$b" ] || exit 0
      grep -Psi "(\\\\v|\\\\r|\\\\m|\\\\s|\b$(grep '^ID=' /etc/os-release | cut -d= -f2 | tr -d '\"')\b)" "$b" || true
    exit-status: 0
    stdout: ['!/./']
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.7.5
      NIST800-53R5:
      - SC-8
  {{ end }}
{{ end }}
