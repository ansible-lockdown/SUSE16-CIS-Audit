---

{{ if .Vars.suse16cis_level_1 }}
  {{ if not .Vars.suse16cis_is_mail_server }}
    {{ if .Vars.suse16cis_rule_2_1_21 }}
command:
  mta_listening_port25:
    title: 2.1.21 | Ensure mail transfer agents are configured for local-only mode
    exit-status: 1
    exec: 'ss -lntu | grep -E ":25\s" | grep -E -v "\s(127.0.0.1|\[?::1\]?):25\s"'
    stdout: ['!/./']
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.21
      NIST800-53R5:
      - CM-7
  postfix_inet_interfaces:
    title: 2.1.21 | Ensure mail transfer agents are configured for local-only mode | inet_interfaces
    exit-status: 0
    exec: "if command -v postconf >/dev/null 2>&1; then postconf inet_interfaces; else echo 'postfix not installed'; fi"
    stdout:
    - '/(?i)(postfix not installed|^inet_interfaces\s*=\s*(loopback-only|localhost|127\.0\.0\.1)\s*$)/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.21
      NIST800-53R5:
      - CM-7
    {{ end }}
  {{ end }}
{{ end }}
