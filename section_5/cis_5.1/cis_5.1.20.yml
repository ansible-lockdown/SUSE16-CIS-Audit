---

{{ if .Vars.suse16cis_level_1 }}
  {{ if .Vars.suse16cis_rule_5_1_20 }}
command:
  ssh_permit_root:
    title: 5.1.20 | Ensure sshd PermitRootLogin is disabled | live
    exec: "sshd -T 2>/dev/null | grep -i '^permitrootlogin' || true"
    exit-status: 0
    stdout:
    - '/(?i)PermitRootLogin no/'
    - '!/(?i)PermitRootLogin yes/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.20
      NIST800-53R5:
      - AC-6
  {{ end }}
{{ end }}
