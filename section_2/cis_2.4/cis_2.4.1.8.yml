---

{{ if .Vars.suse16cis_level_1 }}
  {{ if .Vars.suse16cis_rule_2_4_1_8 }}
file:
  cron_deny_absent:
    title: 2.4.1.8 | Ensure access to /etc/cron.d is configured
    path: /etc/cron.deny
    exists: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.4.1.8
      NIST800-53R5:
      - AC-3
      - MP-2
  cron_allow_restricted:
    title: 2.4.1.8 | Ensure access to /etc/cron.d is configured
    path: /etc/cron.allow
    exists: true
    owner: root
    group: root
    mode: "0640"
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.4.1.8
      - 2.4.1.8
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
