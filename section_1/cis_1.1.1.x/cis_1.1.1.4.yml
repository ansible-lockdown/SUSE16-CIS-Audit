---

{{ if .Vars.suse16cis_level_1 }}
  {{ if .Vars.suse16cis_rule_1_1_1_4 }}
command:
  hfs:
    title: 1.1.1.4 | Ensure hfs kernel module is not available | disabled
    exit-status: 0
    exec: "modprobe -n -v hfs | grep -E '(hfs|install)'"
    stdout:
    - '/install .*unblacklist hfs; /sbin/modprobe --ignore-install hfs/'
    meta:
      server: 1
      workstation: 1
      CIS_ID: 1.1.1.4
      NIST800-53R5: CM-7
  blacklist_hfs:
    title: 1.1.1.4 | Ensure hfs kernel module is not available | blacklist
    exit-status: 0
    exec: grep hfs /etc/modprobe.d/*.conf
    stdout:
      - '/blacklist hfs/'
    meta:
      server: 1
      workstation: 1
      CIS_ID: 1.1.1.4
      NIST800-53R5: CM-7
  {{ end }}
{{ end }}
