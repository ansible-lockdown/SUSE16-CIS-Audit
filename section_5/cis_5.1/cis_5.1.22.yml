---

{{ if .Vars.suse16cis_level_1 }}
  {{ if .Vars.suse16cis_rule_5_1_22 }}
command:
  ssh_usepam:
    title: 5.1.22 | Ensure sshd UsePAM is enabled | live
    exec: "sshd -T 2>/dev/null | grep -i '^usepam' || true"
    exit-status: 0
    stdout:
    - '/(?i)UsePAM yes/'
    - '!/(?i)UsePAM no/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.22
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
