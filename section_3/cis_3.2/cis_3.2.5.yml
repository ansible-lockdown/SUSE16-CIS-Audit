---

{{ if .Vars.suse16cis_level_2 }}
  {{ if .Vars.suse16cis_rule_3_2_5 }}
command:
  modprobe_rds:
    title: 3.2.5 | Ensure rds kernel module is not available | rds config
    exit-status: 0
    exec: 'modprobe -n -v rds'
    stdout:
      - '/install \/bin\/(true|false)/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 3.2.5
      NIST800-53R5:
      - CM-7
      - SI-4
  lsmod_rds:
    title: 3.2.5 | Ensure rds kernel module is not available | running rds
    exit-status: 1
    exec: lsmod | grep -i rds
    stdout:
    - '!/^.*/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 3.2.5
      NIST800-53R5:
      - CM-7
      - SI-4
  {{ end }}
{{ end }}
