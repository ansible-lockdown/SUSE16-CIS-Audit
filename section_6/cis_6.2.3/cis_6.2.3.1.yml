---

{{ if .Vars.suse16cis_level_2 }}
  {{ if .Vars.suse16cis_rule_6_2_3_1 }}
command:
  cis_6_2_3_1_cnf:
    title: 6.2.3.1 | Ensure modification of the /etc/sudoers file is collected | config
    exit-status: 0
    exec: "grep -E -- 'path=/etc/sudoers|dir=/etc/sudoers.d' /etc/audit/rules.d/*.rules"
    stdout:
      - '/path=\/etc\/sudoers -F perm=wa -k scope/'
      - '/dir=\/etc\/sudoers.d\/? -F perm=wa -k scope/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.1
      NIST800-53R5:
      - AU-12
  cis_6_2_3_1_live:
    title: 6.2.3.1 | Ensure modification of the /etc/sudoers file is collected | live
    exit-status: 0
    exec: auditctl -l | grep 'sudoers'
    stdout:
      - '/path=\/etc\/sudoers -F perm=wa -F key=scope/'
      - '/dir=\/etc\/sudoers.d\/? -F perm=wa -F key=scope/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.1
      NIST800-53R5:
      - AU-12
  {{ end }}
{{ end }}
