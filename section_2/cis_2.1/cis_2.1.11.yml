---

{{ if .Vars.suse16cis_level_1 }}
  {{ if .Vars.suse16cis_rule_2_1_11 }}
    {{ if not .Vars.suse16cis_nis_server }}
      {{ if not .Vars.suse16cis_nis_mask }}
package:
  ypserv_pkg:
    title: 2.1.11 | Ensure print server services are not in use | pkg removed
    name: ypserv
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.11
      NIST800-53R5:
      - CM-7
      {{ end }}
      {{ if .Vars.suse16cis_nis_mask }}
file:
  ypserv_service_masked:
    title: 2.1.11 | Ensure print server services are not in use | masked
    path: /etc/systemd/system/ypserv.service
    exists: true
    filetype: symlink
    linked-to: /dev/null
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.11
      NIST800-53R5:
      - CM-7
      {{ end }}
    {{ end }}
  {{ end }}
{{ end }}
