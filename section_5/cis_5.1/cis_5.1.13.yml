---

{{ if .Vars.suse16cis_level_1 }}
  {{ if .Vars.suse16cis_rule_5_1_13 }}
command:
  ssh_logingrace_live:
    title: 5.1.13 | Ensure sshd LoginGraceTime is configured | live
    exec: sshd -T | grep -i '^logingracetime'
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/(?i)^logingracetime ([1-9]|[1-5][0-9]|60)/'
    - '!/(?i)^logingracetime (6[1-9]|[7-9][0-9]|[1-9][0-9]{2,})/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.13
      NIST800-53R5:
      - CM-6
  {{ end }}
{{ end }}
