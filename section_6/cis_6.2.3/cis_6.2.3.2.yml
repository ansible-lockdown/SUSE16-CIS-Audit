---

{{ if .Vars.suse16cis_level_2 }}
  {{ if .Vars.suse16cis_rule_6_2_3_2 }}
command:
  cis_6_2_3_2_cnf:
    title: 6.2.3.2 | Ensure actions as another user are always logged | config
    exit-status: 0
    exec: "grep -E -- 'user_emulation' /etc/audit/rules.d/*.rules"
    stdout:
      - '/-C euid!=uid -F auid!=unset -S execve -k user_emulation/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.2
      NIST800-53R5:
      - AC-6
  cis_6_2_3_2_live:
    title: 6.2.3.2 | Ensure actions as another user are always logged | live
    exit-status: 0
    exec: "auditctl -l | grep user_emulation"
    stdout:
      - '/-a always,exit -F arch=b64 -S execve -C uid!=euid -F auid!=-1 -F key=user_emulation/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.2
      NIST800-53R5:
      - AC-6
  {{ end }}
{{ end }}
