---

{{ if .Vars.suse16cis_level_2 }}
  {{ if .Vars.suse16cis_rule_6_2_1_3 }}
command:
  audit_default_grub:
    title: 6.2.1.3 | Ensure auditing for processes that start prior to auditd is enabled | config
    exec: grep audit= /etc/default/grub
    exit-status: 0
    stdout:
    - '/^GRUB_CMDLINE_LINUX=.*\saudit=1.*/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.1.3
      NIST800-53R5: NA
  audit_running_grub:
    title: 6.2.1.3 | Ensure auditing for processes that start prior to auditd is enabled | running
    exec: grep audit= /proc/cmdline
    exit-status: 0
    stdout:
    - '/^BOOT_IMAGE=.*\saudit=1/'
    - '!/^BOOT_IMAGE=.*\saudit=0/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.1.3
      NIST800-53R5: NA
  {{ end }}
{{ end }}
