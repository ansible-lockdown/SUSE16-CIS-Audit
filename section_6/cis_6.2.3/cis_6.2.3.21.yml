---

{{ if .Vars.suse16cis_level_2 }}
  {{ if .Vars.suse16cis_rule_6_2_3_21 }}
command:
  cis_6_2_3_21_cnf:
    title: 6.2.3.21 | Ensure login and logout events are collected | config
    exit-status: 0
    exec: "grep -E -- 'path=/var/log/lastlog' /etc/audit/rules.d/*.rules"
    stdout:
      - '/path=\/var\/log\/lastlog -F perm=wa -k logins/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.21
      NIST800-53R5:
      - AU-12
  cis_6_2_3_21_live:
    title: 6.2.3.21 | Ensure login and logout events are collected | live
    exit-status: 0
    exec: "auditctl -l | grep -E -- 'path=/var/log/lastlog'"
    stdout:
      - '/path=\/var\/log\/lastlog -F perm=wa -F key=logins/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.21
      NIST800-53R5:
      - AU-12
  {{ end }}
{{ end }}
