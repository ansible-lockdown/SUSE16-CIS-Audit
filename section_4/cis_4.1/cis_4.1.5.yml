---

{{ if .Vars.suse16cis_level_1 }}
  {{ if .Vars.suse16cis_rule_4_1_5 }}
    {{ if eq .Vars.suse16cis_firewall "firewalld" }}
command:
  cis_4_1_5_lo_zone:
    title: 4.1.5 | Ensure firewalld loopback traffic is configured | lo in trusted zone
    exit-status: 0
    exec: "firewall-cmd --get-zone-of-interface=lo"
    stdout:
      - '{{ .Vars.suse16cis_loopback_zone }}'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 4.1.5
      NIST800-53R5:
      - NA
    {{ end }}
  {{ end }}
{{ end }}
