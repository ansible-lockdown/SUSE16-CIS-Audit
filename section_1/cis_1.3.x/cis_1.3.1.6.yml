---

{{ if .Vars.suse16cis_level_2 }}
  {{ if .Vars.suse16cis_rule_1_3_1_6 }}
file:
  selinux_config_enforcing:
    title: 1.3.1.6 | Ensure the SELinux mode is enforcing | config
    path: /etc/selinux/config
    exists: true
    contents:
    - '/^SELINUX=enforcing/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 1.3.1.6
      NIST800-53R5: CM-7
command:
  selinux_running_enforcing:
    title: 1.3.1.6 | Ensure the SELinux mode is enforcing | running mode
    exit-status: 0
    exec: "getenforce"
    stdout:
    - '/^Enforcing$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 1.3.1.6
      NIST800-53R5: CM-7
  {{ end }}
{{ end }}
