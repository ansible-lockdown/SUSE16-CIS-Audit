---

{{ if .Vars.suse16cis_level_1 }}
  {{ if .Vars.suse16cis_rule_1_3_1_2 }}
file:
  selinux_boot_grub:
    title: 1.3.1.2 | Ensure SELinux is not disabled in bootloader configuration | running grub
    path: /etc/default/grub
    exists: true
    contents:
    - '/selinux=1/'
    - '/security=selinux/'
    - '!/selinux=0/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.3.1.2
      NIST800-53R5: AC-3
  grub_app_armor:
    title: 1.3.1.2 | Ensure SELinux is not disabled in bootloader configuration | default grub
    exists: true
    path: /etc/default/grub
    contents:
    - '/^GRUB_CMDLINE_LINUX.*selinux=1/'
    - '/^GRUB_CMDLINE_LINUX.*security=selinux/'
    - '!/selinux=0/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.3.1.2
      NIST800-53R5: AC-3
  {{ end }}
{{ end }}
