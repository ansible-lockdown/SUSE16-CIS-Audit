---

{{ if .Vars.suse16cis_level_2 }}
  {{ if .Vars.suse16cis_rule_6_2_3_17 }}
command:
  cis_6_2_3_17_cnf:
    title: 6.2.3.17 | Ensure discretionary access control permission modification events chown,fchown,lchown,fchownat are collected | config
    exit-status: 0
    exec: "grep -E -- 'arch=b64.*chown.*-k perm_mod' /etc/audit/rules.d/*.rules"
    stdout:
      - '/arch=b64.*chown.*-k perm_mod/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.17
      NIST800-53R5:
      - AU-9
      - AU-12
  cis_6_2_3_17_live:
    title: 6.2.3.17 | Ensure discretionary access control permission modification events chown,fchown,lchown,fchownat are collected | live
    exit-status: 0
    exec: "auditctl -l | grep -E -- 'arch=b64.*chown.*key=perm_mod'"
    stdout:
      - '/arch=b64.*chown.*key=perm_mod/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.17
      NIST800-53R5:
      - AU-9
      - AU-12
  {{ end }}
{{ end }}
