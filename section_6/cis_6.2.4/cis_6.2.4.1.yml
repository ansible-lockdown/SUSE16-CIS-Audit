---

{{ if .Vars.suse16cis_level_2 }}
  {{ if .Vars.suse16cis_rule_6_2_4_1 }}
command:
  auditd_log_directory_mode:
    title: 6.2.4.1 | Ensure the audit log file directory mode is configured
    exec: |
      d="$(dirname "$(awk -F= '/^\s*log_file\s*/{print $2}' /etc/audit/auditd.conf 2>/dev/null | xargs)")"
      [ -d "$d" ] || exit 0
      find "$d" -maxdepth 0 -perm /0027 2>/dev/null || true
    exit-status: 0
    stdout: ['!/./']
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.4.1
      NIST800-53R5:
      - AU-8
  auditd_log_group_configured:
    title: 6.2.4.1 | Ensure the audit log file directory mode is configured | log_group
    exec: "grep -Psi -- '^\\h*log_group\\h*=\\h*(root|adm)\\b' /etc/audit/auditd.conf || true"
    exit-status: 0
    stdout:
    - '/^log_group\s*=\s*(root|adm)/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.4.1
      NIST800-53R5:
      - AU-8
  {{ end }}
{{ end }}
