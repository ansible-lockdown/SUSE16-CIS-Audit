---

{{ if .Vars.suse16cis_level_1 }}
  {{ if .Vars.suse16cis_rule_1_1_1_2 }}
command:
  firewire_core:
    title: 1.1.1.2 | Ensure firewire-core kernel module is not available | disabled
    exit-status: 0
    exec: "modprobe -n -v firewire-core | grep -E '(firewire-core|install)'"
    stdout:
    - '/install /bin/(false|true)/'
    meta:
      server: 1
      workstation: 2
      CIS_ID: 1.1.1.2
      NIST800-53R5: CM-7
  blacklist_firewire_core:
    title: 1.1.1.2 | Ensure firewire-core kernel module is not available | blacklist
    exit-status: 0
    exec: grep firewire-core /etc/modprobe.d/*.conf
    stdout:
      - '/blacklist firewire-core/'
    meta:
      server: 1
      workstation: 2
      CIS_ID: 1.1.1.2
      NIST800-53R5: CM-7
  {{ end }}
{{ end }}
