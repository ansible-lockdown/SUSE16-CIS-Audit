---

{{ if .Vars.suse16cis_level_1 }}
  {{ if .Vars.suse16cis_rule_1_5_7 }}
kernel-param:
  kernel_yama_ptrace_scope_running:
    title: 1.5.7 | Ensure kernel.yama.ptrace_scope is configured | running
    name: kernel.yama.ptrace_scope
    value: '{{ .Vars.suse16cis_kernel_yama_ptrace_scope }}'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.5.7
      NIST800-53R5: CM-6
command:
  kernel_yama_ptrace_scope_conf:
    title: 1.5.7 | Ensure kernel.yama.ptrace_scope is configured | conf
    exit-status: 0
    exec: 'grep "kernel\.yama\.ptrace_scope" /etc/sysctl.conf /etc/sysctl.d/*'
    stdout:
    - '/^*.conf:kernel\.yama\.ptrace_scope\s*=\s*[1-3]/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.5.7
      NIST800-53R5: CM-6
  {{ end }}
{{ end }}
