---

{{ if .Vars.suse16cis_level_2 }}
  {{ if .Vars.suse16cis_rule_6_2_3_12 }}
command:
  cis_6_2_3_12_cnf:
    title: 6.2.3.12 | Ensure events that modify /etc/passwd information are collected | config
    exit-status: 0
    exec: "grep -E -- 'path=/etc/passwd' /etc/audit/rules.d/*.rules"
    stdout:
      - '/path=\/etc\/passwd -F perm=wa -k identity/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.12
      NIST800-53R5:
      - AU-9
      - AU-12
  cis_6_2_3_12_live:
    title: 6.2.3.12 | Ensure events that modify /etc/passwd information are collected | live
    exit-status: 0
    exec: "auditctl -l | grep -E -- 'path=/etc/passwd'"
    stdout:
      - '/path=\/etc\/passwd -F perm=wa -F key=identity/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.12
      NIST800-53R5:
      - AU-9
      - AU-12
  {{ end }}
{{ end }}
