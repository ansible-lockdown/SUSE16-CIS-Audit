---

{{ if .Vars.suse16cis_level_1 }}
  {{ if .Vars.suse16cis_rule_3_2_4 }}
command:
  modprobe_tipc:
    title: 3.2.4 | Ensure tipc kernel module is not available | tipc config
    exit-status: 0
    exec: 'modprobe -n -v tipc'
    stdout:
      - '/install \/bin\/(true|false)/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 3.2.4
      NIST800-53R5:
      - CM-7
      - SI-4
  lsmod_tipc:
    title: 3.2.4 | Ensure tipc kernel module is not available | running tipc
    exit-status: 1
    exec: lsmod | grep -i tipc
    stdout:
    - '!/^.*/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 3.2.4
      NIST800-53R5:
      - CM-7
      - SI-4
  {{ end }}
{{ end }}
