---

{{ if .Vars.suse16cis_gui }}
  {{ if .Vars.suse16cis_level_1 }}
    {{ if .Vars.suse16cis_rule_1_8_3 }}
file:
  gdm_screen_lock:
    title: 1.8.3 | Ensure GDM screen lock is configured | keyfile
    path: /etc/dconf/db/{{ .Vars.suse16cis_dconf_db_name }}.d/00-screensaver
    exists: true
    contents:
    - '/^\[org\/gnome\/desktop\/session\]/'
    - '/^idle-delay=uint32 ([1-9][0-9]{0,2})$/'
    - '!/^idle-delay=uint32 (0|9[0-9][1-9]|[1-9][0-9]{3,})$/'
    - '/^\[org\/gnome\/desktop\/screensaver\]/'
    - '/^lock-delay=uint32 [0-5]$/'
    - '!/^lock-delay=uint32 ([6-9]|[0-9]{2,})$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.8.3
      NIST800-53R5: NA
  gdm_screen_lock_lock:
    title: 1.8.3 | Ensure GDM screen lock is configured | lock
    path: /etc/dconf/db/{{ .Vars.suse16cis_dconf_db_name }}.d/locks/00-screensaver_lock
    exists: true
    contents:
    - '/^\/org\/gnome\/desktop\/session\/idle-delay/'
    - '/^\/org\/gnome\/desktop\/screensaver\/lock-delay/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.8.3
      NIST800-53R5: NA
    {{ end }}
  {{ end }}
{{ end }}
