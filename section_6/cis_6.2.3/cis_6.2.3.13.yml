---

{{ if .Vars.suse16cis_level_2 }}
  {{ if .Vars.suse16cis_rule_6_2_3_13 }}
command:
  cis_6_2_3_13_cnf:
    title: 6.2.3.13 | Ensure events that modify /etc/shadow and /etc/gshadow are collected | config
    exit-status: 0
    exec: "grep -E -- 'path=/etc/shadow' /etc/audit/rules.d/*.rules"
    stdout:
      - '/path=\/etc\/shadow -F perm=wa -k identity/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.13
      NIST800-53R5:
      - AU-9
      - AU-12
  cis_6_2_3_13_live:
    title: 6.2.3.13 | Ensure events that modify /etc/shadow and /etc/gshadow are collected | live
    exit-status: 0
    exec: "auditctl -l | grep -E -- 'path=/etc/shadow'"
    stdout:
      - '/path=\/etc\/shadow -F perm=wa -F key=identity/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.13
      NIST800-53R5:
      - AU-9
      - AU-12
  {{ end }}
{{ end }}
