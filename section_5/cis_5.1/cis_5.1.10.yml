---

{{ if .Vars.suse16cis_level_1 }}
  {{ if .Vars.suse16cis_rule_5_1_10 }}
command:
  ssh_hostbased_auth_live:
    title: 5.1.10 | Ensure sshd HostbasedAuthentication is disabled | live
    exec: sshd -T | grep -i '^hostbasedauthentication'
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/(?i)^hostbasedauthentication no/'
    - '!/(?i)^hostbasedauthentication yes/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.10
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
