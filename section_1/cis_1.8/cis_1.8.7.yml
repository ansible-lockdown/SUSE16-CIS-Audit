---

{{ if .Vars.suse16cis_gui }}
  {{ if .Vars.suse16cis_desktop_required }}
    {{ if .Vars.suse16cis_level_1 }}
      {{ if .Vars.suse16cis_rule_1_8_7 }}
file:
  00-media-autorun_override:
    title: 1.8.7 | Ensure Xwayland is configured
    path: /etc/dconf/db/{{ .Vars.suse16cis_dconf_db_name }}.d/00-media-autorun
    exists: true
    contents:
    - '^/\/org\/gnome\/desktop\/media-handling\/automount/'
    - '^/\/org\/gnome\/desktop\/media-handling\/automount-open/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.8.7
      {{ end }}
    {{ end }}
  {{ end }}
{{ end }}
