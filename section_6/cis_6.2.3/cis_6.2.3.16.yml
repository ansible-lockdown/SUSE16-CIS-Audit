---

{{ if .Vars.suse16cis_level_2 }}
  {{ if .Vars.suse16cis_rule_6_2_3_16 }}
command:
  cis_6_2_3_16_cnf:
    title: 6.2.3.16 | Ensure discretionary access control permission modification events chmod,fchmod,fchmodat,fchmodat2 are collected | config
    exit-status: 0
    exec: "grep -E -- 'arch=b64.*chmod.*-k perm_mod' /etc/audit/rules.d/*.rules"
    stdout:
      - '/arch=b64.*chmod.*-k perm_mod/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.16
      NIST800-53R5:
      - AU-9
      - AU-12
  cis_6_2_3_16_live:
    title: 6.2.3.16 | Ensure discretionary access control permission modification events chmod,fchmod,fchmodat,fchmodat2 are collected | live
    exit-status: 0
    exec: "auditctl -l | grep -E -- 'arch=b64.*chmod.*key=perm_mod'"
    stdout:
      - '/arch=b64.*chmod.*key=perm_mod/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.16
      NIST800-53R5:
      - AU-9
      - AU-12
  {{ end }}
{{ end }}
