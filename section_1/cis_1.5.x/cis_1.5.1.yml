---

{{ if .Vars.suse16cis_level_1 }}
  {{ if .Vars.suse16cis_rule_1_5_1 }}
kernel-param:
  fs_protected_hardlinks:
    title: 1.5.1 | Ensure fs.protected_hardlinks is configured | running
    name: fs.protected_hardlinks
    value: '1'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.5.1
      NIST800-53R5: CM-6
command:
  fs_protected_hardlinks_conf:
    title: 1.5.1 | Ensure fs.protected_hardlinks is configured | conf
    exec: grep "fs.protected_hardlinks" /etc/sysctl.conf /etc/sysctl.d/* 2>/dev/null
    exit-status:
      or:
      - 0
      - 2
    stdout:
    - '/.*:fs.protected_hardlinks\s*=\s*1/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.5.1
      NIST800-53R5: CM-6
  {{ end }}
{{ end }}
