---

{{ if .Vars.suse16cis_gui }}
  {{ if .Vars.suse16cis_desktop_required }}
    {{ if .Vars.suse16cis_level_1 }}
      {{ if .Vars.suse16cis_rule_1_8_4 }}
file:
  00-screensaver:
    title: 1.8.4 | Ensure GDM automount is configured
    path: /etc/dconf/db/{{ .Vars.suse16cis_dconf_db_name }}.d/00-screensaver
    exists: true
    contents:
    - '/^[org/gnome/desktop/session]/'
    - '/^idle-delay=uint32 (1|[1-9]|[1-8][0-9]{1,2}|900)$/'
    - '!/^idle-delay=uint32 (90[1-9]|9[1-9][0-9]|1[0-9]{3,})$/'
    - '/^lock-delay=uint32 [0-5]$/'
    - '!/^lock-delay=uint32 ([6-9]|[0-9]{2,})$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.8.4
      {{ end }}
    {{ end }}
  {{ end }}
{{ end }}
