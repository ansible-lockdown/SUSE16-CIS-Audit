---

{{ if .Vars.suse16cis_gui }}
  {{ if .Vars.suse16cis_level_1 }}
    {{ if .Vars.suse16cis_rule_1_8_4 }}
file:
  gdm_media_automount:
    title: 1.8.4 | Ensure GDM automount is configured | keyfile
    path: /etc/dconf/db/{{ .Vars.suse16cis_dconf_db_name }}.d/00-media-automount
    exists: true
    contents:
    - '/^\[org\/gnome\/desktop\/media-handling\]/'
    - '/^automount=false/'
    - '/^automount-open=false/'
    - '!/^automount=true/'
    - '!/^automount-open=true/'
    meta:
      server: 1
      workstation: 2
      CIS_ID:
      - 1.8.4
      NIST800-53R5: NA
  gdm_media_automount_lock:
    title: 1.8.4 | Ensure GDM automount is configured | lock
    path: /etc/dconf/db/{{ .Vars.suse16cis_dconf_db_name }}.d/locks/00-automount_lock
    exists: true
    contents:
    - '/^\/org\/gnome\/desktop\/media-handling\/automount/'
    - '/^\/org\/gnome\/desktop\/media-handling\/automount-open/'
    meta:
      server: 1
      workstation: 2
      CIS_ID:
      - 1.8.4
      NIST800-53R5: NA
    {{ end }}
  {{ end }}
{{ end }}
