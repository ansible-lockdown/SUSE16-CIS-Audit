---

{{ if .Vars.suse16cis_level_1 }}
  {{ if .Vars.suse16cis_rule_6_1_1_4 }}
command:
  journald_storage:
    title: 6.1.1.4 | Ensure journald Storage is configured
    exec: grep -i storage /etc/systemd/journald.conf /etc/systemd/journald.conf.d/*
    exit-status:
      or: [0, 1, 2]
    stdout:
    - '/(?i)^.*:Storage\s*=\s*persistent/'
    - '!/(?i)^.*:Storage\s*=\s*none/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.1.1.4
      NIST800-53R5:
      - AU-3
      - AU-12
  {{ end }}
{{ end }}
