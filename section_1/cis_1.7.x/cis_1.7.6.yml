---

{{ if .Vars.suse16cis_level_1 }}
  {{ if .Vars.suse16cis_rule_1_7_6 }}
command:
  motd_access_configured:
    title: 1.7.6 | Ensure access to /etc/motd is configured
    exec: |
      find /etc/motd -maxdepth 0 \( -perm /0133 -o ! -user root -o ! -group root \) 2>/dev/null || true
    exit-status: 0
    stdout: ['!/./']
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.7.6
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
