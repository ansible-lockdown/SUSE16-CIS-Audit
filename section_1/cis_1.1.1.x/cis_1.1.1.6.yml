---

{{ if .Vars.suse16cis_level_1 }}
  {{ if .Vars.suse16cis_rule_1_1_1_6 }}
command:
  jffs2:
    title: 1.1.1.6 | Ensure jffs2 kernel module is not available | disabled
    exit-status: 0
    exec: "modprobe -n -v jffs2 | grep -E '(jffs2|install)'"
    stdout:
    - '/install .*unblacklist jffs2; /sbin/modprobe --ignore-install jffs2/'
    meta:
      server: 1
      workstation: 1
      CIS_ID: 1.1.1.6
      NIST800-53R5: CM-7
  blacklist_jffs2:
    title: 1.1.1.6 | Ensure jffs2 kernel module is not available | blacklist
    exit-status: 0
    exec: grep jffs2 /etc/modprobe.d/*.conf
    stdout:
      - '/blacklist jffs2/'
    meta:
      server: 1
      workstation: 1
      CIS_ID: 1.1.1.6
      NIST800-53R5: CM-7
  {{ end }}
{{ end }}
