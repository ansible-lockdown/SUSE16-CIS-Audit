---

{{ if .Vars.suse16cis_level_2 }}
  {{ if .Vars.suse16cis_rule_6_2_3_4 }}
command:
  cis_6_2_3_4_cnf:
    title: 6.2.3.4 | Ensure events that modify date and time information are collected | config
    exit-status: 0
    exec: "grep -E -- 'time-change|/etc/localtime' /etc/audit/rules.d/*.rules"
    stdout:
      - '/-k time-change/'
      - '/path=\/etc\/localtime -F perm=wa -k time-change/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.4
      NIST800-53R5:
      - AU-3
      - CM-6
  cis_6_2_3_4_live:
    title: 6.2.3.4 | Ensure events that modify date and time information are collected | live
    exit-status: 0
    exec: "auditctl -l | grep -E -- 'time-change|/etc/localtime'"
    stdout:
      - '/-F key=time-change/'
      - '/path=\/etc\/localtime -F perm=wa -F key=time-change/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.4
      NIST800-53R5:
      - AU-3
      - CM-6
  {{ end }}
{{ end }}
