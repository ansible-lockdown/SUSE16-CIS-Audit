---

{{ if .Vars.suse16cis_level_1 }}
  {{ if .Vars.run_heavy_tests }}
    {{ if .Vars.suse16cis_rule_1_2_1_2 }}
command:
  gpg_check_global:
    title: 1.2.1.2 | Ensure gpgcheck is configured
    exit-status: 0
    exec: "grep -Pis -- '^\\h*gpgcheck\\h*=\\h*(0|false|no|off)\\b' /etc/zypp/zypp.conf /usr/etc/zypp/zypp.conf /etc/zypp/zypp.conf.d/*.conf; grep -Pris -- '^\\h*gpgcheck\\h*=\\h*(0|[2-9]|[1-9][0-9]+|false|no|off)\\b' /etc/zypp/repos.d/; true"
    stdout: ['!/./']
    timeout: {{ .Vars.timeout_ms }}
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.2.1.2
      NIST800-53R5: SI-2
      {{ end }}
  {{ end }}
{{ end }}
