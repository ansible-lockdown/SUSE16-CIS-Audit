---

{{ if .Vars.suse16cis_level_2 }}
  {{ if .Vars.suse16cis_rule_5_1_8 }}
command:
  ssh_disable_forward_live:
    title: 5.1.8 | Ensure sshd DisableForwarding is enabled | live
    exec: sshd -T | grep -i '^disableforwarding'
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/(?i)^disableforwarding yes/'
    - '!/(?i)^disableforwarding no/'
    meta:
      server: 2
      workstation: 1
      CIS_ID:
      - 5.1.8
      NIST800-53R5:
      - CM-7
  {{ end }}
{{ end }}
