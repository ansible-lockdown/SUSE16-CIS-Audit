---

{{ if .Vars.suse16cis_level_1 }}
  {{ if .Vars.suse16cis_rule_5_1_17 }}
command:
  ssh_maxstartups:
    title: 5.1.17 | Ensure sshd MaxStartups is configured | live
    exec: "sshd -T 2>/dev/null | grep -i '^maxstartups' || true"
    exit-status: 0
    stdout:
    - 'MaxStartups 10:30:60'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.17
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
