---

{{ if .Vars.suse16cis_gui }}
  {{ if .Vars.suse16cis_level_1 }}
    {{ if .Vars.suse16cis_rule_1_8_6 }}
command:
  gdm_xdmcp_disabled:
    title: 1.8.6 | Ensure XDMCP is not enabled
    exec: |
      awk '/\[xdmcp\]/{f=1;next} /^\[/{f=0} f && /^[[:space:]]*Enable[[:space:]]*=[[:space:]]*true/{print}' /etc/gdm/custom.conf 2>/dev/null
    exit-status: 0
    stdout: ['!/./']
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.8.6
      NIST800-53R5: NA
    {{ end }}
  {{ end }}
{{ end }}
