---

{{ if .Vars.suse16cis_level_1 }}
  {{ if .Vars.suse16cis_rule_5_3_2_1_1 }}
file:
  faillock_attempts_deny:
    title: 5.3.2.1.1 | Ensure password failed attempts lockout is configured
    path: /etc/security/faillock.conf
    exists: true
    contents:
    - '/^deny\s*=\s*[1-5]$/'
    - '!/^deny\s*=\s*([6-9]|[0-9]{2,})/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.2.1.1
      NIST800-53R5: NA
  {{ end }}
{{ end }}
