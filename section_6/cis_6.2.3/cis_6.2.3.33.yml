---

{{ if .Vars.suse16cis_level_2 }}
  {{ if .Vars.suse16cis_rule_6_2_3_33 }}
command:
  cis_6_2_3_33_cnf:
    title: 6.2.3.33 | Ensure the audit configuration is loaded regardless of errors | config
    exit-status: 0
    exec: grep -Ph -- '^\h*-c\b' /etc/audit/rules.d/*.rules | tail -1
    stdout:
      - '/^-c/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.33
      NIST800-53R5:
      - AU-12
  {{ end }}
{{ end }}
