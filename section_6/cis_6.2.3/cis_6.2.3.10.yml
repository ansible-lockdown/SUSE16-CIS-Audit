---

{{ if .Vars.suse16cis_level_2 }}
  {{ if .Vars.suse16cis_rule_6_2_3_10 }}
command:
  cis_6_2_3_10_cnf:
    title: 6.2.3.10 | Ensure unsuccessful file access attempts are collected | config
    exit-status: 0
    exec: "grep -E -- 'arch=b64.*-k access' /etc/audit/rules.d/*.rules"
    stdout:
      - '/arch=b64.*-k access/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.10
      NIST800-53R5:
      - AU-9
      - AU-12
  cis_6_2_3_10_live:
    title: 6.2.3.10 | Ensure unsuccessful file access attempts are collected | live
    exit-status: 0
    exec: "auditctl -l | grep -E -- 'arch=b64.*key=access'"
    stdout:
      - '/arch=b64.*key=access/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.10
      NIST800-53R5:
      - AU-9
      - AU-12
  {{ end }}
{{ end }}
