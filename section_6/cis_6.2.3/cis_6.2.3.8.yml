---

{{ if .Vars.suse16cis_level_2 }}
  {{ if .Vars.suse16cis_rule_6_2_3_8 }}
command:
  cis_6_2_3_8_cnf:
    title: 6.2.3.8 | Ensure events that modify /etc/NetworkManager directory are collected | config
    exit-status: 0
    exec: "grep -E -- 'dir=/etc/NetworkManager/' /etc/audit/rules.d/*.rules"
    stdout:
      - '/dir=\/etc\/NetworkManager\/ -F perm=wa -k system-locale/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.8
      NIST800-53R5:
      - AU-2
      - AU-12
  cis_6_2_3_8_live:
    title: 6.2.3.8 | Ensure events that modify /etc/NetworkManager directory are collected | live
    exit-status: 0
    exec: "auditctl -l | grep -E -- 'dir=/etc/NetworkManager/'"
    stdout:
      - '/dir=\/etc\/NetworkManager\/ -F perm=wa -F key=system-locale/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.8
      NIST800-53R5:
      - AU-2
      - AU-12
  {{ end }}
{{ end }}
