---

{{ if .Vars.suse16cis_level_1 }}
  {{ if .Vars.suse16cis_rule_6_1_3_1 }}
command:
  logfile_permissions_zypp:
    title: 6.1.3.1 | Ensure access to all logfiles has been configured | zypper
    exec: find /var/log/zypp /var/log/zypper.log -type f \( -perm /0133 -o -not -user root -o \( -not -group root -a -not -group adm \) \) -ls 2>/dev/null || true
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/.+/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.1.3.1
      NIST800-53R5:
      - AC-3
      - MP-2

  logfile_permissions_tmp:
    title: 6.1.3.1 | Ensure access to all logfiles has been configured | tmp/wtmp/btmp/lastlog/README
    exec: find /var/log -type f -regextype posix-extended -regex '/var/log/((u|b|w)tmp.*|lastlog.*|README)' -not -path '/var/log/apt/*' \( -perm /0113 -o -not -user root -o \( -not -group root -a -not -group utmp \) \) -ls
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/.+/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.1.3.1
      NIST800-53R5:
      - AC-3
      - MP-2

  logfile_permissions_cloud_init:
    title: 6.1.3.1 | Ensure access to all logfiles has been configured | cloud-init/localmessages/waagent
    exec: find /var/log -type f -regextype posix-extended -regex '/var/log/(cloud-init\.log.*|localmessages.*|waagent\.log.*)' -not -path '/var/log/apt/*' \( -perm /0133 -o \( -not -user root -a -not -user syslog \) -o \( -not -group root -a -not -group adm \) \) -ls
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/.+/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.1.3.1
      NIST800-53R5:
      - AC-3
      - MP-2

  logfile_permissions_secure:
    title: 6.1.3.1 | Ensure access to all logfiles has been configured | secure/auth.log/syslog/messages
    exec: find /var/log -type f -regextype posix-extended -regex '.*/(secure(,.*|\..*|-.*)?|auth\.log|syslog|messages)' -not -path '/var/log/apt/*' \( -perm /0137 -o \( -not -user root -a -not -user syslog \) -o \( -not -group root -a -not -group adm \) \) -ls
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/.+/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.1.3.1
      NIST800-53R5:
      - AC-3
      - MP-2

  logfile_permissions_sssd:
    title: 6.1.3.1 | Ensure access to all logfiles has been configured | sssd
    exec: find /var/log -type f -regextype posix-extended -regex '.*/(sssd|SSSD)(/.*)?' \( -perm /0117 -o \( -not -user root -a -not -user sssd -a -not -user SSSD \) -o \( -not -group root -a -not -group sssd -a -not -group SSSD \) \) -ls
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/.+/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.1.3.1
      NIST800-53R5:
      - AC-3
      - MP-2

  logfile_permissions_gdm:
    title: 6.1.3.1 | Ensure access to all logfiles has been configured | gdm/gdm3
    exec: find /var/log -type f -regextype posix-extended -regex '.*/(gdm|gdm3)(/.*)?' \( -perm /0117 -o -not -user root -o \( -not -group root -a -not -group gdm -a -not -group gdm3 \) \) -ls
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/.+/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.1.3.1
      NIST800-53R5:
      - AC-3
      - MP-2

  logfile_permissions_journal:
    title: 6.1.3.1 | Ensure access to all logfiles has been configured | journal
    exec: find /var/log -type f -regextype posix-extended -regex '.*\.journal~?' \( -perm /0137 -o -not -user root -o \( -not -group root -a -not -group systemd-journal \) \) -ls
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/.+/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.1.3.1
      NIST800-53R5:
      - AC-3
      - MP-2

  logfile_permissions_default:
    title: 6.1.3.1 | Ensure access to all logfiles has been configured | default
    exec: find /var/log -type f -regextype posix-extended -not -regex '/var/log/apt/.*' -not -regex '/var/log/((u|b|w)tmp.*|lastlog.*|README)' -not -regex '/var/log/(cloud-init\.log.*|localmessages.*|waagent\.log.*)' -not -regex '.*/(secure(,.*|\..*|-.*)?|auth\.log|syslog|messages)' -not -regex '.*/(sssd|SSSD)(/.*)?' -not -regex '.*/(gdm|gdm3)(/.*)?' -not -regex '.*\.journal~?' \( -perm /0137 -o \( -not -user root -a -not -user syslog \) -o \( -not -group root -a -not -group adm \) \) -ls
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/.+/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.1.3.1
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
