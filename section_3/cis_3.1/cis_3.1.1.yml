---

{{ if .Vars.suse16cis_level_1 }}
  {{ if not .Vars.suse16cis_ipv6_required }}
   {{ if .Vars.suse16cis_rule_3_1_1 }}
 file:
  ipv6_disabled:
    title: 3.1.1 | Ensure IPv6 status is identified | sysctl all disable
    path: /etc/sysctl.d/60-disable_ipv6.conf
    exists: true
    contents:
    - '/^net.ipv6.conf.all.disable_ipv6\s*=\s*1/'
    - '/net.ipv6.conf.default.disable_ipv6\s*=\s*1/'
    meta:
      server: 2
      workstation: 2
      CIS_ID: 3.1.1
      NIST800-53R5:
      - CM-7
    {{ end }}
  {{ end }}
{{ end }}
