---

{{ if .Vars.suse16cis_level_1 }}
{{ if not .Vars.suse16cis_selinux_disable }}
  {{ if .Vars.suse16cis_rule_1_3_1_3 }}
file:
  selinux_targeted:
    title: 1.3.1.3 | Ensure SELinux policy is configured | profile
    path: /etc/selinux/config
    exists: true
    contents:
    - '/(?i)SELINUXTYPE=(targeted|mls)/'
    - '!/(?i)SELINUXTYPE=(disabled|off|false)/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.3.1.3
      NIST800-53R5: AC-3
  {{ end }}
  {{ end }}
{{ end }}
