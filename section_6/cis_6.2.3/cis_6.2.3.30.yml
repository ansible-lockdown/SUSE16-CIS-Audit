---

{{ if .Vars.suse16cis_level_2 }}
  {{ if .Vars.suse16cis_rule_6_2_3_30 }}
command:
  cis_6_2_3_30_cnf:
    title: 6.2.3.30 | Ensure kernel "init_module" and "finit_module" loading unloading and modification is collected | config
    exit-status: 0
    exec: "grep -E -- 'arch=b64.*init_module.*-k kernel_modules' /etc/audit/rules.d/*.rules"
    stdout:
      - '/arch=b64.*init_module.*-k kernel_modules/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.30
      NIST800-53R5:
      - AU-12
      - CM-7
  cis_6_2_3_30_live:
    title: 6.2.3.30 | Ensure kernel "init_module" and "finit_module" loading unloading and modification is collected | live
    exit-status: 0
    exec: "auditctl -l | grep -E -- 'arch=b64.*init_module.*key=kernel_modules'"
    stdout:
      - '/arch=b64.*init_module.*key=kernel_modules/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.30
      NIST800-53R5:
      - AU-12
      - CM-7
  {{ end }}
{{ end }}
