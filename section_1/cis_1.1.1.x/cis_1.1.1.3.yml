---

{{ if .Vars.suse16cis_level_1 }}
  {{ if .Vars.suse16cis_rule_1_1_1_3 }}
command:
  freevxfs:
    title: 1.1.1.3 | Ensure freevxfs kernel module is not available | disabled
    exit-status: 0
    exec: "modprobe -n -v freevxfs | grep -E '(freevxfs|install)'"
    stdout:
    - '/install .*unblacklist freevxfs; /sbin/modprobe --ignore-install freevxfs/'
    meta:
      server: 1
      workstation: 1
      CIS_ID: 1.1.1.3
      NIST800-53R5: CM-7
  blacklist_freevxfs:
    title: 1.1.1.3 | Ensure freevxfs kernel module is not available | blacklist
    exit-status: 0
    exec: grep freevxfs /etc/modprobe.d/*.conf
    stdout:
      - '/blacklist freevxfs/'
    meta:
      server: 1
      workstation: 1
      CIS_ID: 1.1.1.3
      NIST800-53R5: CM-7
  {{ end }}
{{ end }}
