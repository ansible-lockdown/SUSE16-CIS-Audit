---

{{ if .Vars.suse16cis_level_1 }}
  {{ if .Vars.suse16cis_rule_5_3_2_2_2 }}
command:
  difok_check_not_pam:
    title: 5.3.2.2.2 | Ensure password number of changed characters is configured
    exec: grep -Psi -- '^\h*difok\h*=\h*([2-9]|[1-9][0-9]+)\b' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    exit-status:
      or:
      - 0
      - 1
      - 2
    stdout:
    - '/.*:difok\s*=\s*([2-9]|1[0-9])/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.2.2.2
      NIST800-53R5: IA-5
  {{ end }}
{{ end }}
