---

{{ if .Vars.suse16cis_level_2 }}
  {{ if .Vars.suse16cis_rule_6_2_3_6 }}
command:
  cis_6_2_3_6_cnf:
    title: 6.2.3.6 | Ensure events that modify /etc/issue and /etc/issue.net are collected | config
    exit-status: 0
    exec: "grep -E -- 'path=/etc/issue' /etc/audit/rules.d/*.rules"
    stdout:
      - '/path=\/etc\/issue -F perm=wa -k system-locale/'
      - '/path=\/etc\/issue.net -F perm=wa -k system-locale/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.6
      NIST800-53R5:
      - AU-3
      - CM-6
  cis_6_2_3_6_live:
    title: 6.2.3.6 | Ensure events that modify /etc/issue and /etc/issue.net are collected | live
    exit-status: 0
    exec: "auditctl -l | grep -E -- 'path=/etc/issue'"
    stdout:
      - '/path=\/etc\/issue -F perm=wa -F key=system-locale/'
      - '/path=\/etc\/issue.net -F perm=wa -F key=system-locale/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.6
      NIST800-53R5:
      - AU-3
      - CM-6
  {{ end }}
{{ end }}
