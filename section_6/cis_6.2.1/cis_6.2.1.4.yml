---

{{ if .Vars.suse16cis_level_2 }}
  {{ if .Vars.suse16cis_rule_6_2_1_4 }}
command:
  audit_backlog_default_grub:
    title: 6.2.1.4 | Ensure audit_backlog_limit is configured | default
    exec: grep audit_backlog /etc/default/grub
    exit-status: 0
    stdout:
    - '/^GRUB_CMDLINE_LINUX=.*[\s"]audit_backlog_limit=(819[2-9]|8[2-9][0-9]{2}|9[0-9]{3}|[1-9][0-9]{4,}).*/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.1.4
      NIST800-53R5:
      - AU-2
      - AU-12
      - SI-5
  audit_backlog_running_grub:
    title: 6.2.1.4 | Ensure audit_backlog_limit is configured | running
    exec: grep audit_backlog /proc/cmdline
    exit-status: 0
    stdout:
    - '/^BOOT_IMAGE=.*\saudit_backlog_limit=(819[2-9]|8[2-9][0-9]{2}|9[0-9]{3}|[1-9][0-9]{4,}).*/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.1.4
      NIST800-53R5:
      - AU-2
      - AU-12
      - SI-5
  {{ end }}
{{ end }}
