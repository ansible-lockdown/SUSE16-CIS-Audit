---

{{ if .Vars.suse16cis_level_1 }}
  {{ if .Vars.suse16cis_rule_5_4_3_4 }}
command:
  umask_profile_d:
    title: 5.4.3.4 | Ensure default user umask in /etc/profile.d is configured
    exit-status: 0
    exec: "grep -Pi -- '^\\h*umask\\h+0[2-7][7]\\b' /etc/profile.d/60-default_umask.sh"
    stdout:
      - '/umask\s+0[2-7][7]/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.4.3.4
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
