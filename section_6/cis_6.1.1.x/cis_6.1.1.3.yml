---

{{ if .Vars.suse16cis_level_1 }}
  {{ if .Vars.suse16cis_rule_6_1_1_3 }}
command:
  journald_compress:
    title: 6.1.1.3 | Ensure journald Compress is configured
    exec: grep -i compress /etc/systemd/journald.conf /etc/systemd/journald.conf.d/*
    exit-status:
      or: [0, 1, 2]
    stdout:
    - '/(?i)^.*:Compress\s*=\s*yes/'
    - '!/(?i)^.*:Compress\s*=\s*no/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.1.1.3
      NIST800-53R5:
      - AU-4
  {{ end }}
{{ end }}
