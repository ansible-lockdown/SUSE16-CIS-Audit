---

{{ if .Vars.suse16cis_level_1 }}
  {{ if .Vars.suse16cis_rule_5_3_2_2_1 }}
command:
  dict_check_not_pam:
    title: 5.3.2.2.1 | Ensure password dictionary check is enabled
    exec: grep -Psi -- '^\h*dictcheck\h*=\h*0\b' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    exit-status:
      or:
      - 0
      - 1
      - 2
    stdout:
    - '!/^.*/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.2.2.1
      NIST800-53R5: IA-5
  {{ end }}
{{ end }}
