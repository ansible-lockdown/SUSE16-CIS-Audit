---

{{ if .Vars.suse16cis_level_1 }}
  {{ if .Vars.suse16cis_rule_5_1_21 }}
command:
  ssh_userenv:
    title: 5.1.21 | Ensure sshd PermitUserEnvironment is disabled | live
    exec: "sshd -T 2>/dev/null | grep -i '^permituserenvironment' || true"
    exit-status: 0
    stdout:
    - '/(?i)PermitUserEnvironment no/'
    - '!/(?i)PermitUserEnvironment yes/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.21
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
