---

{{ if .Vars.suse16cis_level_2 }}
  {{ if .Vars.suse16cis_rule_6_2_3_34 }}
command:
  cis_6_2_3_34_cnf:
    title: 6.2.3.34 | Ensure the audit configuration is immutable | config
    exit-status: 0
    exec: grep -Ph -- '^\h*-e\h+2\b' /etc/audit/rules.d/*.rules | tail -1
    stdout:
      - '/-e\s*2/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.34
      NIST800-53R5:
      - AU-9
  {{ end }}
{{ end }}
