---

{{ if .Vars.suse16cis_level_1 }}
  {{ if .Vars.suse16cis_rule_1_7_4 }}
command:
  pam_motd_configured:
    title: 1.7.4 | Ensure pam_motd is configured
    exec: |
      grep -Psi '^\h*session\h+(required|optional)\h+pam_motd\.so\b.*\bmotd=' \
        /etc/pam.d/sshd /etc/pam.d/login /etc/pam.d/su /etc/pam.d/gdm-password 2>/dev/null || true
    exit-status: 0
    stdout: ['!/./']
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.7.4
      NIST800-53R5:
      - SC-8
  {{ end }}
{{ end }}
