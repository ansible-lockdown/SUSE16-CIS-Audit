---

{{ if .Vars.suse16cis_gui }}
    {{ if .Vars.suse16cis_level_1 }}
      {{ if .Vars.suse16cis_rule_1_8_6 }}
file:
  00-media-automount_disable:
    title: 1.8.6 | Ensure XDMCP is not enabled
    path: /etc/dconf/db/{{ .Vars.suse16cis_dconf_db_name }}.d/00-media-automount
    exists: true
    contents:
    - '/^[org/gnome/desktop/media-handling]/'
    - '/^automount=false/'
    - '/^automount-open=false/'
    - '!/^automount=true/'
    - '!/^automount-open=true/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.8.6
      {{ end }}
    {{ end }}
{{ end }}
