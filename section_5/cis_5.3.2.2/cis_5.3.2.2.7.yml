---

{{ if .Vars.suse16cis_level_1 }}
  {{ if .Vars.suse16cis_rule_5_3_2_2_7 }}
command:
  enforce_for_root_check_not_pam:
    title: 5.3.2.2.7 | Ensure password quality is enforced for the root user
    exec: grep 'enforce_for_root' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    exit-status:
      or:
      - 0
      - 1
      - 2
    stdout:
    - '/.*:enforce_for_root/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.2.2.7
      NIST800-53R5: IA-5
  {{ end }}
{{ end }}
