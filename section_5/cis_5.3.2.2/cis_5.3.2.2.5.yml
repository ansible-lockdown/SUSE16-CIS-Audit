---

{{ if .Vars.suse16cis_level_1 }}
  {{ if .Vars.suse16cis_rule_5_3_2_2_5 }}
command:
  maxrepeat_check_not_pam:
    title: 5.3.2.2.5 | Ensure password same consecutive characters is configured
    exec: grep 'maxrepeat' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    exit-status:
      or:
      - 0
      - 1
      - 2
    stdout:
    - '/.*:maxrepeat\s*=\s*[1-3]/'
    - '!/.*:maxrepeat\s*=\s*(0|[4-9]|[1-9][0-9])/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.2.2.5
      NIST800-53R5: IA-5
  {{ end }}
{{ end }}
