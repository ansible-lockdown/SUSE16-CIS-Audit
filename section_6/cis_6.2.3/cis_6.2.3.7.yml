---

{{ if .Vars.suse16cis_level_2 }}
  {{ if .Vars.suse16cis_rule_6_2_3_7 }}
command:
  cis_6_2_3_7_cnf:
    title: 6.2.3.7 | Ensure events that modify /etc/hosts and /etc/hostname are collected | config
    exit-status: 0
    exec: "grep -E -- 'path=/etc/host' /etc/audit/rules.d/*.rules"
    stdout:
      - '/path=\/etc\/hosts -F perm=wa -k system-locale/'
      - '/path=\/etc\/hostname -F perm=wa -k system-locale/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.7
      NIST800-53R5:
      - AU-3
      - CM-6
  cis_6_2_3_7_live:
    title: 6.2.3.7 | Ensure events that modify /etc/hosts and /etc/hostname are collected | live
    exit-status: 0
    exec: "auditctl -l | grep -E -- 'path=/etc/host'"
    stdout:
      - '/path=\/etc\/hosts -F perm=wa -F key=system-locale/'
      - '/path=\/etc\/hostname -F perm=wa -F key=system-locale/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.7
      NIST800-53R5:
      - AU-3
      - CM-6
  {{ end }}
{{ end }}
