---

{{ if .Vars.suse16cis_level_1 }}
  {{ if .Vars.suse16cis_rule_5_4_1_6 }}
command:
  passwd_chg_past:
    title: 5.4.1.6 | Ensure all users last password change date is in the past
    exec: |
      now=$(date +%s)
      while IFS=: read -r usr _; do
        d=$(chage --list "$usr" 2>/dev/null | awk -F': ' '/^Last password change/{print $2}')
        case "$d" in ''|never|password*) continue;; esac
        s=$(date -d "$d" +%s 2>/dev/null) || continue
        [ "$s" -gt "$now" ] && echo "Failed: $usr"
      done < /etc/shadow
      true
    exit-status: 0
    stdout:
    - '!/Failed/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.4.1.6
      NIST800-53R5: NA
  {{ end }}
{{ end }}
