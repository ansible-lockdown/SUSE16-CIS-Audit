---

{{ if .Vars.suse16cis_level_1 }}
  {{ if .Vars.suse16cis_rule_5_1_7 }}
command:
  sshd_clientalive_live:
    title: 5.1.7 | Ensure sshd ClientAliveInterval and ClientAliveCountMax are configured | live
    exec: sshd -T | grep -i '^clientalive'
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^(?i)clientaliveinterval ([1-9]|[1-9][0-9]|[1-8][0-9][0-9]|900)/'
    - '/^(?i)ClientAliveCountMax [1-4]/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.7
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
