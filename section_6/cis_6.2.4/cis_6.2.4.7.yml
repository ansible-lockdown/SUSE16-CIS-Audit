---

{{ if .Vars.suse16cis_level_2 }}
  {{ if .Vars.suse16cis_rule_6_2_4_7 }}
command:
  cis_6_2_4_7:
    title: 6.2.4.7 | Ensure audit configuration files group owner is configured | files not group-owned by root
    exit-status:
      or:
      - 0
      - 1
    exec: "find /etc/audit/ -type f \\( -name '*.conf' -o -name '*.rules' \\) ! -group root 2>/dev/null"
    stdout:
      - '!/.+/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.4.7
      NIST800-53R5:
      - AU-9
  {{ end }}
{{ end }}
