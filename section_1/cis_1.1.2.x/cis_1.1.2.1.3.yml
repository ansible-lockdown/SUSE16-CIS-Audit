---

{{ if .Vars.suse16cis_level_1 }}
  {{ if .Vars.suse16cis_rule_1_1_2_1_3 }}
mount:
  tmp_nosuid_options:
    title: 1.1.2.1.3 | Ensure nosuid option set on /tmp partition
    mountpoint: /tmp
    exists: true
    opts:
    - nosuid
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.1.2.1.3
      NIST800-53R5:
      - CM-7
      - AC-3
      - MP-2
command:
  tmp_nosuid_persistent_options:
    title: 1.1.2.1.3 | Ensure nosuid option set on /tmp partition | persistent config
    exec: |
      if [ "$(systemctl show tmp.mount -p SourcePath --value)" = "/etc/fstab" ]; then
        findmnt --fstab -n -o OPTIONS /tmp
      else
        systemctl cat tmp.mount 2>/dev/null | awk -F= '/^Options=/{print $2}'
      fi
    exit-status: 0
    stdout:
    - '/\bnosuid\b/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.1.2.1.3
      NIST800-53R5:
      - CM-7
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
