---

{{ if .Vars.suse16cis_level_2 }}
  {{ if .Vars.suse16cis_rule_6_2_3_9 }}
command:
  cis_6_2_3_9_cnf:
    title: 6.2.3.9 | Ensure use of privileged commands are collected | config
    exit-status: 0
    exec: "grep -E -- '-k privileged' /etc/audit/rules.d/*.rules"
    stdout:
      - '/-k privileged/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.9
      NIST800-53R5:
      - AU-9
      - AU-12
  cis_6_2_3_9_live:
    title: 6.2.3.9 | Ensure use of privileged commands are collected | live
    exit-status: 0
    exec: "auditctl -l | grep -E -- 'key=privileged'"
    stdout:
      - '/key=privileged/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.9
      NIST800-53R5:
      - AU-9
      - AU-12
  {{ end }}
{{ end }}
