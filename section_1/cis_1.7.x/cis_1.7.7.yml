---

{{ if .Vars.suse16cis_level_1 }}
  {{ if .Vars.suse16cis_rule_1_7_7 }}
file:
  etc_issue_access:
    title: 1.7.7 | Ensure access to /etc/issue is configured
    path: /etc/issue
    exists: true
    mode:
      or:
      - '0644'
      - '0640'
      - '0600'
      - '0444'
      - '0440'
      - '0400'
    owner: root
    group: root
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.7.7
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
