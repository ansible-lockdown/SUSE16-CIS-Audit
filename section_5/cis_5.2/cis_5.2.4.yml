---

{{ if .Vars.suse16cis_level_2 }}
  {{ if .Vars.suse16cis_rule_5_2_4 }}
command:
  nopasswd_sudoers_d:
    title: 5.2.4 | Ensure users must provide password for escalation
    exec: grep -R NOPASSWD /etc/sudoers /etc/sudoers.d/* | grep -v '.*\:#'{{ range .Vars.suse16cis_sudoers_exclude_nopasswd_list }} | grep -Ev ':{{ . }}[[:space:]]'{{ end }}
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/.*/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 5.2.4
      NIST800-53R5:
      - AC-6
  {{ end }}
{{ end }}
