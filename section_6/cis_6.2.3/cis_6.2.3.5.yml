---

{{ if .Vars.suse16cis_level_2 }}
  {{ if .Vars.suse16cis_rule_6_2_3_5 }}
command:
  cis_6_2_3_5_cnf:
    title: 6.2.3.5 | Ensure events that modify sethostname and setdomainname are collected | config
    exit-status: 0
    exec: "grep -E -- 'sethostname|setdomainname' /etc/audit/rules.d/*.rules"
    stdout:
      - '/-S sethostname,setdomainname -k system-locale/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.5
      NIST800-53R5:
      - AU-3
      - CM-6
  cis_6_2_3_5_live:
    title: 6.2.3.5 | Ensure events that modify sethostname and setdomainname are collected | live
    exit-status: 0
    exec: "auditctl -l | grep -E -- 'sethostname|setdomainname'"
    stdout:
      - '/-S sethostname,setdomainname -F key=system-locale/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.5
      NIST800-53R5:
      - AU-3
      - CM-6
  {{ end }}
{{ end }}
