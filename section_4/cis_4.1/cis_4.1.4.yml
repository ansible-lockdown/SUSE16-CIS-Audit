---

{{ if .Vars.suse16cis_level_2 }}
  {{ if .Vars.suse16cis_rule_4_1_4 }}
    {{ if eq .Vars.suse16cis_firewall "firewalld" }}
command:
  cis_4_1_4:
    title: 4.1.4 | Ensure firewalld active zone target is configured
    exit-status: 0
    exec: "for z in $(firewall-cmd --get-active-zones 2>/dev/null | awk '!/^ /{print $1}'); do i=$(firewall-cmd --zone=$z --list-interfaces); echo \"$i\" | grep -Eqx '(lo|virbr[^ ]+)?' && continue; t=$(firewall-cmd --permanent --zone=$z --get-target); case $t in ACCEPT|'') echo \"$z target=$t interfaces=$i\";; esac; done"
    stdout: ['!/./']
    meta:
      server: 2
      workstation: "NA"
      CIS_ID:
      - 4.1.4
      NIST800-53R5:
      - NA
    {{ end }}
  {{ end }}
{{ end }}
