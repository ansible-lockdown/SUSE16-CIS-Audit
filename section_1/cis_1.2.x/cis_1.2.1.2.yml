---

{{ if .Vars.suse16cis_level_1 }}
  {{ if .Vars.run_heavy_tests }}
    {{ if .Vars.suse16cis_rule_1_2_1_2 }}
command:
  gpg_check_global:
    title: 1.2.1.2 | Ensure gpgcheck is configured
    exit-status: 0
    exec: "grep -Psi -- '^\\h*gpgcheck\\h*=\\h*1\\b' /etc/zypp/zypp.conf || true"
    stdout:
    - '/^\\s*gpgcheck\\s*=\\s*1/'
    - '!/^\\s*gpgcheck\\s*=\\s*0/'
    timeout: {{ .Vars.timeout_ms }}
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.2.1.2
      NIST800-53R5: SI-2
      {{ end }}
  {{ end }}
{{ end }}
