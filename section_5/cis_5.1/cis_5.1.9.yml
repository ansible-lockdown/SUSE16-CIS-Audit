---

{{ if .Vars.suse16cis_level_2 }}
  {{ if .Vars.suse16cis_rule_5_1_9 }}
command:
  ssh_gssapi_live:
    title: 5.1.9 | Ensure sshd GSSAPIAuthentication is disabled | live
    exec: sshd -T | grep -i gssapiauthentication
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^gssapiauthentication no/'
    - '!/^gssapiauthentication yes/'
    meta:
      server: 2
      workstation: 1
      CIS_ID:
      - 5.1.9
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
